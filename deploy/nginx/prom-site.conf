# nginx для pm52.ru — боевой конфиг, после выпуска сертификатов.
# Кладётся в /etc/nginx/sites-available/prom-site.conf, ссылка в sites-enabled.
#
# Главное правило сайта — любой кривой адрес приводится к каноническому
# https://www.pm52.ru ОДНИМ переходом (см. src/proxy.ts). Поэтому nginx сам
# http → https и pm52.ru → www не редиректит: страницы он отдаёт приложению
# с X-Forwarded-Proto, и proxy считает протокол, домен и старый путь вместе.
# Иначе http://pm52.ru/kontakty/ ехал бы на /contacts за два перехода.
#
# Сам nginx редиректит только то, мимо чего proxy проходит по матчеру:
# /api, /admin, /_next и пути с точкой (статика, sitemap.xml, robots.txt).
#
# `listen ... http2`, а не `http2 on`: в Ubuntu 24.04 nginx 1.24, директива
# `http2` появилась только в 1.25.

upstream prom_site {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Пути, которые proxy приложения не видит: их на неканонический адрес
# сводит nginx
map $uri $prom_static_path {
    default                       0;
    ~^/(api|admin|_next)(/|$)     1;
    ~\.[^/]+$                     1;
}

# ---- pm52.ru и www.pm52.ru, http ----
server {
    listen 80;
    listen [::]:80;
    server_name pm52.ru www.pm52.ru;

    # Продление сертификата certbot --webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        if ($prom_static_path) {
            return 301 https://www.pm52.ru$request_uri;
        }
        include /etc/nginx/snippets/prom-site-proxy.conf;
    }
}

# ---- pm52.ru без www, https ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pm52.ru;

    ssl_certificate     /etc/letsencrypt/live/pm52.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pm52.ru/privkey.pem;

    location / {
        if ($prom_static_path) {
            return 301 https://www.pm52.ru$request_uri;
        }
        include /etc/nginx/snippets/prom-site-proxy.conf;
    }
}

# ---- www.pm52.ru, https — канонический адрес ----
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name www.pm52.ru;

    ssl_certificate     /etc/letsencrypt/live/pm52.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pm52.ru/privkey.pem;

    # Загрузка картинок в админке: по умолчанию nginx режет тело на 1 МБ
    client_max_body_size 20m;

    # Сборка Next: имена файлов с хешем, кешировать можно надолго
    location /_next/static/ {
        include /etc/nginx/snippets/prom-site-proxy.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include /etc/nginx/snippets/prom-site-proxy.conf;
    }
}

# ---- про-м.рф — лендинг закрыт, всё на главную нового сайта ----
# Решение Дмитрия 06.10.2026. Путь не сохраняется: лендинг был одной
# страницей с якорями, преемник у любого его адреса — главная.
server {
    listen 80;
    listen [::]:80;
    server_name xn----xtbedf.xn--p1ai www.xn----xtbedf.xn--p1ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.pm52.ru/;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn----xtbedf.xn--p1ai www.xn----xtbedf.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn----xtbedf.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn----xtbedf.xn--p1ai/privkey.pem;

    return 301 https://www.pm52.ru/;
}
