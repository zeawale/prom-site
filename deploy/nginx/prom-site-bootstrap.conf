# nginx для pm52.ru — временный конфиг до выпуска сертификатов.
# Только http: боевой конфиг ссылается на файлы сертификатов, и без них
# nginx не стартует. Этот нужен, чтобы certbot прошёл проверку домена и
# чтобы сайт можно было открыть по IP сервера до переключения DNS.
# После certbot заменить на prom-site.conf (см. deploy/README.md).

upstream prom_site {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name pm52.ru www.pm52.ru xn----xtbedf.xn--p1ai www.xn----xtbedf.xn--p1ai _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 20m;

    location / {
        include /etc/nginx/snippets/prom-site-proxy.conf;
    }
}
