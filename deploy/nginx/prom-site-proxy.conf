# Общие настройки проксирования на приложение.
# Кладётся в /etc/nginx/snippets/prom-site-proxy.conf.

proxy_pass http://prom_site;
proxy_http_version 1.1;
proxy_set_header Connection "";

# src/proxy.ts сводит домен и протокол по этим двум заголовкам: без них
# редирект с http и с домена без www не сработает
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;

# IP посетителя — submitLead пишет его в согласие на обработку данных
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;

proxy_read_timeout 60s;
